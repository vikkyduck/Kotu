<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psy Библиотека</title>
    <meta name="description" content="Psy Библиотека — площадка психоаналитика: расшифровки, библиотека, лекции и презентации." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Psy Библиотека" />
    <meta property="og:description" content="Psy Библиотека: расшифровки, библиотека, лекции и презентации." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Тема до загрузки приложения — чтобы не мигало тёмным у любителей бумаги -->
    <script>
      try {
        var t = localStorage.getItem('kot-theme');
        if (!t) t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
