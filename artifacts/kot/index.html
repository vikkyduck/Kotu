<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека Кота</title>
    <meta name="description" content="Psy Библиотека — площадка психоаналитика: расшифровки, библиотека, лекции и презентации." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Psy Библиотека" />
    <meta property="og:description" content="Psy Библиотека: расшифровки, библиотека, лекции и презентации." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Шрифты подключены локально из src/index.css (@font-face). Внешних
         CDN на странице нет: из России Google Fonts висит до таймаута и
         держит белый экран, а §10 запрещает зарубежные CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Тема до загрузки приложения, чтобы не мигало. По умолчанию — бумага;
         тёмная только по сохранённому выбору. Приложение тему отсюда читает. -->
    <script>
      var t = null;
      try { t = localStorage.getItem('kot-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
