<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека Кота</title>
    <meta name="description" content="Psy Библиотека — площадка психоаналитика: расшифровки, библиотека, лекции и презентации." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Psy Библиотека" />
    <meta property="og:description" content="Psy Библиотека: расшифровки, библиотека, лекции и презентации." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Шрифты подключены локально из src/index.css (@font-face). Внешних

         держит белый экран, а §10 запрещает зарубежные CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Тема до загрузки приложения, чтобы не мигало (public/theme.js).
         Файлом, а не встроенным скриптом: встроенные запрещены политикой
         безопасности сайта (Content-Security-Policy в nginx). -->
    <script src="/theme.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
