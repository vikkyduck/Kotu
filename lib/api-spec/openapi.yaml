openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transcriptions
    description: Audio transcription operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transcriptions:
    get:
      operationId: listTranscriptions
      tags: [transcriptions]
      summary: List transcriptions
      description: Returns all saved transcriptions, newest first
      responses:
        "200":
          description: A list of transcriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transcription"
  /transcriptions/{id}:
    get:
      operationId: getTranscription
      tags: [transcriptions]
      summary: Get a transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateTranscription
      tags: [transcriptions]
      summary: Update a transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionUpdate"
      responses:
        "200":
          description: The updated transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTranscription
      tags: [transcriptions]
      summary: Delete a transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    TranscriptSegment:
      type: object
      properties:
        who:
          type: string
        text:
          type: string
      required:
        - who
        - text
    Transcription:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        filename:
          type: string
        hideNames:
          type: boolean
        markSpeakers:
          type: boolean
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - filename
        - hideNames
        - markSpeakers
        - segments
        - createdAt
        - updatedAt
    TranscriptionUpdate:
      type: object
      properties:
        title:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
